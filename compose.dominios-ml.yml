# Coolify / compose: Dominios ML
# Git: este repositorio. Dockerfile: Dockerfile (raíz) o dominios_ml/Dockerfile
# Puerto: 8004. Ruta pública: https://geoia.site/dominios-ml/
services:
  dominios_ml:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      STREAMLIT_SERVER_PORT: "8004"
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      WEB_CONCURRENCY: "1"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
