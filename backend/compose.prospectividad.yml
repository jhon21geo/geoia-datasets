# Coolify / compose: Prospectividad App
# Apunta el Git source a este repositorio y dockerfile: backend/Dockerfile
services:
  prospectividad_app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - STREAMLIT_SERVER_PORT=8003
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - ROOT_PATH=/prospectividad
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
